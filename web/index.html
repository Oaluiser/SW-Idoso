<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Alô Diário: uma ligação carinhosa por dia para quem você ama, com resumo para a família.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Alô Diário">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Alô Diário</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0C3B31">
  <style>
    html,body{margin:0;background:#FCF6EA;}
    #loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
      background:linear-gradient(#FCF6EA,#E8F4F0);font-family:system-ui,sans-serif;color:#0A2E22;transition:opacity .3s}
    #loading.done{opacity:0}
    #loading .dot{width:56px;height:56px;border-radius:50%;background:#E3F124;display:flex;align-items:center;justify-content:center;
      animation:pulse 1.4s ease-in-out infinite}
    #loading p{margin:0;font-size:15px;color:#5E7A74}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(.88)}}
    @media (prefers-reduced-motion:reduce){#loading .dot{animation:none}}
  </style>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="loading" role="status" aria-live="polite">
    <div class="dot"><svg width="26" height="26" viewBox="0 0 24 24" fill="#0C3B31" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg></div>
    <p>Carregando o Alô Diário…</p>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
