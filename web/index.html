<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Alô Diário: uma ligação carinhosa por dia para quem você ama, com resumo para a família.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Alô Diário">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Alô Diário</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0C3B31">
  <style>
    html,body{margin:0;background:#FCF6EA;}
    #loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
      background:linear-gradient(#FCF6EA,#E8F4F0);font-family:system-ui,sans-serif;color:#0A2E22;transition:opacity .3s}
    #loading.done{opacity:0}
    #loading .dot{width:72px;height:72px;animation:pulse 1.4s ease-in-out infinite}
    #loading p{margin:0;font-size:15px;color:#5E7A74}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(.88)}}
    @media (prefers-reduced-motion:reduce){#loading .dot{animation:none}}
  </style>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="loading" role="status" aria-live="polite">
    <img class="dot" src="brand-icon.png" alt="" width="72" height="72">
    <p>Carregando o Alô Diário…</p>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
